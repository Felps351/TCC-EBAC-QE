name: Executar Testes Mobile Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Habilitar KVM (emulador mais rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar dependências e driver do Appium
        run: |
          cd Mobile
          npm install
          npx appium driver install uiautomator2 || true

      - name: Executar Emulador Android e Rodar Testes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: Mobile
          script: |
            adb wait-for-device
            adb install-multiple -r $(find splits -name '*.apk' ! -name 'base-master.apk' ! -name 'base-master_2.apk')
            echo "### DUMP DO PACOTE br.com.lojaebac ###"
            adb shell dumpsys package br.com.lojaebac | grep -A 30 "android.intent.action.MAIN"
            echo "### FIM DO DUMP ###"
            adb shell monkey -p br.com.lojaebac -c android.intent.category.LAUNCHER 1
            sleep 5
            npx appium --port 4723 > appium.log 2>&1 &
            timeout 90 bash -c 'until curl -s http://127.0.0.1:4723/status | grep -q "ready"; do sleep 2; done'
            npm test

      - name: Salvar evidências (screenshots, page source e log do Appium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-mobile
          path: |
            Mobile/*.png
            Mobile/*.xml
            Mobile/appium.log
          if-no-files-found: ignore